[project]
name = "pythonlearnproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arrow>=1.4.0",
    "cryptography>=50.0.1",
    "faker>=40.38.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "mysql-connector-python>=26.7.0",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyecharts>=2.1.0",
    "pygame>=2.6.1",
    "pymysql>=1.2.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.52",
    "xlsxwriter>=3.2.9",
]

[project.scripts]
pythonlearnproject = "pythonlearnproject:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
